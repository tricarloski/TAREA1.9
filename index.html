<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>

<body>

    <!-- form: crea un formulario -->
    <!-- action: indica dónde se envían los datos -->
    <!-- method: indica el método utilizado para enviarlos -->
    <form action="index.html" method="get">

        <!-- fieldset: agrupa campos relacionados de un formulario -->
        <fieldset>

            <!-- legend: pone un título al grupo de campos -->
            <legend>Datos personales by Carlos</legend>

            <!-- label: relaciona un texto con un campo mediante for -->
            <label for="nombre">Nombre:</label>

            <!-- text: crea un campo de texto -->
            <!-- placeholder: muestra una ayuda dentro del campo vacío -->
            <!-- required: obliga a completar el campo -->
            <!-- autofocus: pone el foco en este campo al cargar la página -->
            <!-- size: indica el ancho visible del campo -->
            <!-- maxlength: limita el número máximo de caracteres -->
            <input type="text" id="nombre" name="nombre"
                placeholder="Choripan"
                required autofocus size="30" maxlength="40">

            <br><br>

            <label for="contrasena">Contraseña:</label>

            <!-- password: oculta los caracteres introducidos -->
            <!-- minlength: indica el mínimo de caracteres -->
            <input type="password" id="contrasena" name="contrasena"
                minlength="8" required>

            <br><br>

            <label for="correo">Correo:</label>

            <!-- email: crea un campo para una dirección de correo -->
            <input type="email" id="correo" name="correo" required>

            <br><br>

            <label for="telefono">Teléfono:</label>

            <!-- tel: crea un campo para un número de teléfono -->
            <!-- pattern: establece el formato que debe cumplir el dato -->
            <input type="tel" id="telefono" name="telefono"
                pattern="[0-9]{9}">
                <label for="fecha">04/02/1702:</label>

<!-- date: permite seleccionar una fecha -->
<input type="date" id="fecha" name="fecha">

<br><br>

<label for="archivo">Tarea:</label>

<!-- file: permite seleccionar un archivo -->
<input type="file" id="archivo" name="archivo">

<br><br>

<label for="curso">1º DAW:</label>

<!-- value: establece el valor inicial del campo -->
<!-- readonly: permite ver el dato pero no modificarlo -->
<input type="text" id="curso" name="curso"
    value="2026-27" readonly>

<br><br>

<label for="centro">Centro Paco:</label>

<!-- disabled: desactiva el campo y su dato no se envía -->
<input type="text" id="centro" name="centro"
    value="IES La Asunción" disabled>

        </fieldset>
    <fieldset>
    <legend>Preferencias</legend>
    <p>Turno:</p>

<!-- radio: permite elegir una sola opción dentro de un grupo -->
<input type="radio" id="manana" name="turno" value="manana">
<label for="manana">Mañana</label>

<input type="radio" id="tarde" name="turno" value="tarde">
<label for="tarde">Tarde</label>
<p>Intereses:</p>

<!-- checkbox: permite marcar varias opciones -->
<input type="checkbox" id="html" name="intereses" value="html">
<label for="html">HTML</label>

<input type="checkbox" id="css" name="intereses" value="css">
<label for="css">CSS</label>

<input type="checkbox" id="javascript" name="intereses" value="javascript">
<label for="javascript">JavaScript</label>

    </form>

</body>

</html>
