<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: crea un formulario -->
<!-- action: indica dónde se envían los datos -->
<!-- method: indica el método utilizado para enviarlos -->
<form action="index.html" method="get">

    <!-- fieldset: agrupa campos relacionados de un formulario -->
    <fieldset>

        <!-- legend: pone un título al grupo de campos -->
        <legend>Datos personales by Carlos</legend>

    </fieldset>

</form>
</body>
</html>
